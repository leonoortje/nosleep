<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scherm wakker houden</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  .card {
    width: 100%;
    max-width: 280px;
    padding: 18px;
    border-radius: 16px;
    background: rgba(30,30,34,.96);
    color: white;
    text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,.22);
  }
  .icon { font-size: 28px; margin-bottom: 5px; }
  .title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 11px 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: #44444b;
    color: white;
  }
  button.on { background: #2e9d5b; }
  .status {
    margin-top: 9px;
    font-size: 12px;
    opacity: .7;
    min-height: 15px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">☀️</div>
  <div class="title">Scherm wakker houden</div>
  <button id="toggle">UIT</button>
  <div class="status" id="status"></div>
</div>

<script>
let wakeLock = null;
const button = document.getElementById('toggle');
const status = document.getElementById('status');

async function enableWakeLock() {
  if (!('wakeLock' in navigator)) {
    status.textContent = 'Wake Lock wordt niet ondersteund';
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    button.textContent = 'AAN 🟢';
    button.classList.add('on');
    status.textContent = 'Scherm blijft wakker';
    wakeLock.addEventListener('release', () => {
      wakeLock = null;
      button.textContent = 'UIT';
      button.classList.remove('on');
      status.textContent = '';
    });
  } catch (err) {
    status.textContent = 'Kon Wake Lock niet activeren';
  }
}

async function disableWakeLock() {
  if (wakeLock) await wakeLock.release();
}

button.addEventListener('click', async () => {
  if (wakeLock) {
    await disableWakeLock();
  } else {
    await enableWakeLock();
  }
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && button.classList.contains('on')) {
    await enableWakeLock();
  }
});
</script>
</body>
</html>
